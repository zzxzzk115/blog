baseURL = "http://localhost:1313/"
title = "Lazy_V's Blog"
theme = "freemind-bithack"
defaultContentLanguage = "en"
hasCJKLanguage = true
summaryLength = 150
locale = "en"
timeZone = "Asia/Shanghai"
# Keep hexo-style URLs: /tags/Unity/ instead of /tags/unity/
disablePathToLower = true
enableRobotsTXT = true

[permalinks.page]
  # same as hexo `permalink: :year/:month/:day/:title/`
  posts = "/:year/:month/:day/:contentbasename/"

[menus]
  [[menus.main]]
    name = "Archives"
    url = "/archives/"
    weight = 10
    [menus.main.params]
      icon = "fa fa-archive"
  [[menus.main]]
    name = "Categories"
    url = "/categories/"
    weight = 20
    [menus.main.params]
      icon = "fa fa-folder"
  [[menus.main]]
    name = "Tags"
    url = "/tags/"
    weight = 30
    [menus.main.params]
      icon = "fa fa-tags"
  [[menus.main]]
    name = "Games"
    url = "/games/"
    weight = 40
    [menus.main.params]
      icon = "fa fa-gamepad"
  [[menus.main]]
    name = "Friends"
    url = "/friends/"
    weight = 50
    [menus.main.params]
      icon = "fa fa-users"
  [[menus.main]]
    name = "About"
    url = "/about/"
    weight = 60
    [menus.main.params]
      icon = "fa fa-user"
  [[menus.main]]
    name = "Wiki"
