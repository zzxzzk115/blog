    url = "https://lazy-v.itch.io/"
    icon = "fa fa-gamepad"

# Markdown rendering (theme defaults, copied here because Hugo does not merge [markup] from themes)
[markup]
  [markup.highlight]
    noClasses = false
    lineNos = true
    lineNumbersInTable = true
    tabWidth = 4
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 4
    ordered = false
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.parser.attribute]
    block = true
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [["$$", "$$"], ["\\[", "\\]"]]
      inline = [["$", "$"], ["\\(", "\\)"]]


[outputs]
  home = ["html", "atom", "searchxml"]
  section = ["html"]
  taxonomy = ["html"]
  term = ["html"]

[pagination]
  pagerSize = 10
