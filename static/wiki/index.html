<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <!-- <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/themes/vue.css"> -->

  <link rel="stylesheet" href="css/sidebar.css">
  <link href="favicon.png" rel="icon">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css" />
  
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      plugins: [
        function(hook) {
          hook.doneEach(function() {
            // 自定义的代码行号插件
            var codes = document.getElementsByTagName("code");
            if(codes.length > 0) {
              for(var i = 0; i < codes.length; i++) {
                var lan = codes[i].className;
                console.log(lan);
                if(lan) {
                  var codeStyle = getComputedStyle(codes[i]);
                  var codeFontSize = codeStyle.fontSize;
                  console.log(codeFontSize);
                  var arr = codes[i].innerHTML.split("\n");
                  var text = "<ol style=\"font-size:" + parseInt(codeFontSize) + "px;\">";
                  arr.forEach(item => {
                    // if(item.trim()!=""){
                      text += "<li>"+ item +"</li>";
                    // }
                  });
                  text += "</ol>";
                  codes[i].innerHTML = text;
                }
              }
            }
          });
        }
      ],
      alias: {
      '/.*/sidebar.md': '/sidebar.md'
      },
      loadSidebar: "/sidebar.md",
      subMaxLevel: 2,
      autoHeader: true,
      auto2top: true,
      search: {
        noData: {
          '/zh-cn/': '没有结果!',
          '/': 'No results!'
        },
        paths: 'auto',
        placeholder: {
          '/zh-cn/': '搜索',
          '/': 'Search'
        },
        // hideOtherSidebarContent: true,
        depth: 6,
      },
      pagination: {
        previousText: '上一章节',
        nextText: '下一章节',
        crossChapter: true,
        crossChapterText: true,
      },
      name: 'Jack\'s Wiki',
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
  <script src="https://cdn.bootcss.com/jquery/3.3.1/jquery.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/external-script.min.js"></script>

  <!-- Highlight Plugins -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.22.0/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.22.0/components/prism-c.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.22.0/components/prism-cpp.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.22.0/components/prism-cmake.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.22.0/components/prism-csharp.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.22.0/components/prism-java.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.22.0/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.22.0/components/prism-makefile.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.22.0/components/prism-markdown.min.js"></script>

  <!-- fix bug -->
  <button class="sidebar-pin" onclick="togglePin()"></button>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const targetNode = document.querySelector('.sidebar-nav')
      const config = { attributes: false, childList: true, subtree: true }
      const observer = new MutationObserver(() => {
        let dom = document.querySelector(`[href="${decodeURIComponent(location.hash).replace(/ /gi, '%20')}"]`)

        while (dom && dom.classList && dom.className !== 'sidebar-nav') {
          dom.classList.add('open')
          dom = dom.parentNode
        }
      })
      observer.observe(targetNode, config)
    })
  </script>
  <script>
    function togglePin() {
      let pin = localStorage.getItem('pin')
      pin = pin === 'true'
      localStorage.setItem('pin', !pin)
      if (pin) {
        document.querySelector('.sidebar').style.transform = 'translateX(0)'
        document.querySelector('.content').style.transform = 'translateX(0)'
      } else {
        document.querySelector('.sidebar').style.transform = 'translateX(300px)'
        document.querySelector('.content').style.transform = 'translateX(300px)'
      }
    }
    window.addEventListener('load', () => {
      const content = document.querySelector('.content')
      document.body.onclick = content.onclick = (e) => {
        if (e.target === document.body || e.currentTarget === content) {
          if (localStorage.getItem('pin') === 'true') {
            togglePin()
          }
        }
      }
    })
  </script>
    <!-- <link rel="stylesheet" href="css/dark.css" media="screen" type="text/css"> -->
    <!-- fix bug -->
</body>
</html>
