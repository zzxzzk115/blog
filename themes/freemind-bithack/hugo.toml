# freemind.bithack for Hugo — theme defaults.
# Every value here can be overridden in the site's own hugo.toml.

[module.hugoVersion]
  extended = false
  min = "0.146.0"

[mediaTypes."application/atom+xml"]
  suffixes = ["xml"]

[outputFormats.atom]
  mediaType = "application/atom+xml"
  baseName = "atom"
  isPlainText = false
  rel = "alternate"

# search.xml: same format hexo-generator-search produced, consumed by js/search.js
[outputFormats.searchxml]
  mediaType = "application/xml"
  baseName = "search"
  isPlainText = true
  notAlternative = true


# NOTE: Hugo does not merge [outputs], [pagination] or [markup] from a theme.
# Copy them from exampleSite/hugo.toml (or the README) into your site config.

[params]
  slogan = "TALK IS CHEAP, SHOW ME THE CODE."
  showSlogan = true
  showHeart = true
  dateFormat = "2006-01-02"
  favicon = "favicon.png"
  fancybox = true
  # Sidebar widgets, rendered in order from _partials/widgets/<name>.html.
  # Add your own widget by creating layouts/_partials/widgets/<name>.html in the site.
  widgets = ["search", "category", "tagcloud", "recent_posts", "links"]
  tagcloudLimit = 20
  recentPostsLimit = 5
  # Math: "auto" renders only on pages with `math: true`; "always" everywhere; "never" off.
  math = "auto"
  # KaTeX output: "mathml" needs no CSS/fonts; "htmlAndMathml" loads katex.css from CDN.
  mathOutput = "mathml"
  externalLinksNewTab = true
  # Posts without <!--more--> show an automatic summary on the home page (like hexo-excerpt).
  # Set to false to show the full post instead.
  autoExcerpt = true

  [params.copyright]
    enable = true
    license = "CC BY-NC-SA 4.0"
    licenseURL = "https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh"

  [params.comments]
    # "", "giscus" or "valine"
    provider = ""
