{{- /* Receives a Paginator. */ -}}
{{- if gt .TotalPages 1 }}
<div class="pagination">
  {{- if .HasPrev }}
  <a href="{{ .Prev.URL }}" class="btn btn-default"><i class="fa fa-arrow-circle-o-left"></i> {{ T "prev" }}</a>
  {{- else }}
  <a class="btn btn-default disabled"><i class="fa fa-arrow-circle-o-left"></i> {{ T "prev" }}</a>
  {{- end }}
  <a href="{{ "/" | relURL }}" class="btn btn-default"><i class="fa fa-home"></i>Home</a>
  {{- if .HasNext }}
  <a href="{{ .Next.URL }}" class="btn btn-default">{{ T "next" }} <i class="fa fa-arrow-circle-o-right"></i></a>
  {{- else }}
  <a class="btn btn-default disabled">{{ T "next" }} <i class="fa fa-arrow-circle-o-right"></i></a>
  {{- end }}
</div>
{{- end }}
