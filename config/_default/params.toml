# Zpix (最像素, https://github.com/SolidZORO/zpix-pixel-font): free for personal sites; may not be modified or split,
# so the release's zpix.woff2 is used as is, and it lives in this blog only (not in the theme).
[bodyFont]
  family = "Zpix"
  src = "fonts/zpix/zpix.woff2"
  # body text in CSS px (the theme's 18px proportions scale to it); 16px is pixel-exact at 150% and on phones
  sizes = { text = 16 }
