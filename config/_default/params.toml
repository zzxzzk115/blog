# Theme options (defaults: themes/freemind-bithack/hugo.toml)
author = "Lazy_V"

# Sections whose pages count as articles (home page, archives, feeds, recent posts).
# Pages can opt out with `article: false` in front matter.
mainSections = ["posts", "game-dev", "hpg-notes"]

widgets = ["author", "search", "category", "tagcloud", "timeline", "recent_posts"]


# Lazy_V's red V: home page logo and browser icon (the theme's defaults are generic)
logo = "images/lazy-v.png"
favicon = "images/lazy-v.png"

# "Edit this page" links (path from content/ is appended)
editURL = "https://github.com/zzxzzk115/blog/edit/master/"


[copyright]
  enable = true
  license = "CC BY-NC-SA 4.0"
  licenseURL = "https://creativecommons.org/licenses/by-nc-sa/4.0/"


[authorCard]
  name = "Lazy_V"
  # 1-bit GitHub avatar
  avatar = "avatar.png"

# Same giscus discussion repo as the VuePress blog; with the same page paths
# (baseURL .../blog/), existing comment threads carry over.
[comments]
  provider = "giscus"
  [comments.giscus]
    repo = "zzxzzk115/blog"
    repoId = "R_kgDOIgnAxw"
    category = "Announcements"
    categoryId = "DIC_kwDOIgnAx84CSx8v"
    mapping = "pathname"

[pageviews]
  provider = ""   # "busuanzi" / "vercount"

