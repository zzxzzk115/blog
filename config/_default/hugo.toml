# Site-wide settings. Language-specific settings live in languages.toml,
# menus in menus.<lang>.toml, theme options in params.toml, Markdown in markup.toml.
baseURL = "http://localhost:1313/"
theme = "freemind-bithack"
timeZone = "Asia/Shanghai"

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false   # en at /, zh at /zh/

hasCJKLanguage = true
summaryLength = 150
# Keep hexo-style term URLs: /tags/Unity/ instead of /tags/unity/
disablePathToLower = true
enableRobotsTXT = true
enableEmoji = true

[taxonomies]
  category = "categories"
  tag = "tags"

[permalinks.page]
  # Posts without an explicit `url` (the 2020–2022 hexo posts, and new posts) get
  # the hexo URL shape: /zh/2021/01/10/astar-in-unity/
  posts = "/:year/:month/:day/:contentbasename/"

[outputs]
  home = ["html", "rss", "atom", "jsonfeed", "searchindex", "webmanifest"]
  section = ["html"]
  taxonomy = ["html"]
  term = ["html"]

# The VuePress blog published /rss.xml; keep that name for existing subscribers.
[outputFormats.rss]
  baseName = "rss"

[pagination]
  pagerSize = 10

# "Related posts" under each article
[related]
  includeNewer = true
  threshold = 60
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 60
  [[related.indices]]
    name = "date"
    weight = 10
