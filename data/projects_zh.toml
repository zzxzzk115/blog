[lazy_100]
desc = "Lua 幻想主机，自带代码、精灵、地图、音效与音乐编辑器，基于 VRI 构建，可在桌面和浏览器里玩。"

[vultra_ecosystem]
desc = "面向科研和游戏的图形与引擎项目集合；libvultra 目前在基于 VRI 的 dev-VRI 分支上开发。"
status = "当前开发：dev-VRI · 早期阶段"

[light-propagation-volumes]
desc = "我的硕士毕业设计渲染器，实现了光传播体积（Light Propagation Volumes），以及级联阴影、环境光遮蔽和屏幕空间反射。"
status = "硕士毕业设计"

[cells_of_division]
desc = "Steam 上的俯视角弹幕 Roguelike：在免疫系统里与「过去几局的自己」并肩作战，免费试玩已上线。我是 High Path Games 联合创始人、程序负责人。"

[gold_minder_rebirth]
desc = "经典 Flash 游戏黄金矿工的忠实重制，用 LÖVE2D 制作，可在 GameShell、Trimui 等复古掌机上运行。"

[vri]
desc = "跨平台渲染硬件接口（RHI），提供 C ABI 和 C++23 封装，后端包括 Vulkan、D3D12、Metal、WebGPU 和 OpenGL 系列。"
status = "开发中"

[catmario_gb]
desc = "用 GB Studio 为 Game Boy 重做的整蛊平台游戏猫里奥，可在 itch.io 或兼容的 Game Boy 模拟器上玩。"

[omnilyrics]
desc = "跨平台的桌面、终端和状态栏歌词工具：图形界面、CLI/TUI、双语卡拉 OK，基于 .NET 10 和 Avalonia。"
status = "已发布桌面版"

[snow_leopard_engine]
desc = "利兹大学 7 人硕士团队打造的 C++ / OpenGL 4.6 游戏引擎，也是 Vultra 故事的起点。"

[vri-framework]
desc = "构建在 VRI 之上的可复用 C++23 渲染组件：RAII 资源、FrameGraph、性能分析、多队列提交和 OpenXR 工具。"
status = "已公开 · 开发中"

[vplot]
desc = "通过 C ABI 提供的 C++23 绘图库，支持导出 PNG、SVG 和 PDF，集成 ImGui，并有 WebAssembly 演示。"
status = "早期开发 · API 仍在变化"

[mchose-control-linux]
desc = "MCHOSE 鼠标的 Linux 图形界面与命令行工具：DPI 与传感器设置、按应用切换的预设，以及 KDE 桌面集成。"

[vgfw]
desc = "用于图形原型开发的 header-only OpenGL 框架，带模型加载、FrameGraph 和 Tracy 性能分析。"

[vshadersystem]
desc = "基于 Slang 的着色器编译管线：材质反射、关键字变体，以及可移植的运行时着色器库。"

[vasset]
desc = "资源导入与打包管线：基于 UUID 的注册表、自定义网格和纹理格式、VPK 归档以及命令行工具。"

[pocketchip-macos]
desc = "定制的 Mini vMac 构建和掌机配置，让 PocketCHIP 跑起经典 Mac OS System 7.5。"
status = "掌机移植"

[online-tools]
desc = "在浏览器里计算 SSIM、PSNR、MSE，生成绝对误差图和热力图的工具，中英双语界面。"

[bbk-gameshell]
desc = "基于 bbk.emu 把经典步步高游戏适配到 GameShell，带掌机启动器和按键操作。"
status = "掌机适配"

[wqx-gameshell]
desc = "把文曲星 NC1020 模拟器适配到 GameShell，基于 jswqx 和 NW.js，集成到掌机启动器。"
status = "掌机适配"

[vraytracer]
desc = "早期的 C++ 光线追踪器，带 ImGui 界面、多线程渲染和可配置场景。"
status = "早期图形项目"

[vsoft-renderer]
desc = "小型 CPU 软渲染器，支持可编程 C++ 着色器、Gouraud 着色和带纹理的 Phong 着色。"
status = "早期图形项目"

[j2me-asset-hunter]
desc = "从 J2ME JAR 文件中提取游戏资源的命令行工具。"

[bixuetang]
desc = "面向中文学习者的公开课自学应用：按先修关系规划学习路径，记录进度，支持视频笔记和间隔重复。"

[chip8-cpp]
desc = "C++23 编写的 CHIP-8 解释器，用 SDL2 处理画面、输入和声音，是我模拟器开发之路的起点。"
status = "早期模拟器项目"

[vrendergraph]
desc = "用 JSON 描述渲染管线并在运行时构建 FrameGraph，支持资源槽、schema 版本管理和编辑器辅助。"

[nw-unity]
desc = "把 Unity WebGL 导出打包成 NW.js 应用的 Python 命令行工具，包括 GameShell 打包模式。"
status = "早期工具项目"

[academic-casual-template]
desc = "我个人主页背后的可复用 Astro + Vue 模板，提供学术和休闲两种展示，内容放在独立仓库。"

[portfolio-98]
desc = "Windows 98 风格的交互式作品集：桌面窗口、移动端 Pocket PC 风格外壳，还内嵌了游戏。"

